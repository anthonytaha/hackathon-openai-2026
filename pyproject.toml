[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-privacy"
version = "0.1.0"
description = "Dashboard and API for privacy-aware MP3 transcription and audio redaction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.32",
    "streamlit>=1.63,<2",
    "supabase>=2.7,<3",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["privacy_pipeline"]
